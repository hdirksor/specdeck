{{ define "main" }}
<article class="markdown" data-pagefind-body>
<h1>{{ .Site.Title }}</h1>
{{ range .Site.Sections }}
<section>
  <h2>{{ .Title }}</h2>
  <ul class="container-list">
    {{ range .Pages }}
    <li>
      <a href="{{ .Permalink }}">{{ .Title }}</a>
    </li>
    {{ end }}
  </ul>
</section>
{{ end }}
</article>
{{ end }}
