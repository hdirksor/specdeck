<table>
  <thead>
    <tr><th>Spec</th><th>Value</th><th>Description</th></tr>
  </thead>
  <tbody>
    {{ range $key, $val := . }}
    <tr>
      <td><code>{{ $key }}</code></td>
      {{ if reflect.IsMap $val }}
      <td><code>{{ index $val "value" }}</code></td>
      <td>{{ index $val "description" }}</td>
      {{ else }}
      <td><code>{{ $val }}</code></td>
      <td></td>
      {{ end }}
    </tr>
    {{ end }}
  </tbody>
</table>
