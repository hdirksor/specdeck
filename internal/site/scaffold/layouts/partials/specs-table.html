<table>
  <thead>
    <tr><th>Spec</th><th>Value</th><th>Description</th></tr>
  </thead>
  <tbody>
    {{ range $key, $val := . }}
    <tr>
      <td class="spec-key">{{ $key }}</td>
      {{ if reflect.IsMap $val }}
      <td class="spec-value">{{ index $val "value" }}</td>
      <td class="spec-desc">{{ index $val "description" }}</td>
      {{ else }}
      <td class="spec-value">{{ $val }}</td>
      <td class="spec-desc"></td>
      {{ end }}
    </tr>
    {{ end }}
  </tbody>
</table>
